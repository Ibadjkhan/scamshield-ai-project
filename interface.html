<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScamShield</title><style>
body{font-family:system-ui,sans-serif;background:#f1f5f9;margin:0;color:#172033}.box{max-width:650px;margin:48px auto;background:white;padding:32px;border-radius:14px;box-shadow:0 8px 28px #33415522}h1{margin:0;color:#173d68}.sub{color:#526074}textarea,button{box-sizing:border-box;width:100%;font:inherit;border-radius:8px}textarea{padding:12px;border:1px solid #94a3b8;margin:8px 0}button{padding:12px;border:0;background:#173d68;color:white;font-weight:700;cursor:pointer}#result{display:none;margin-top:18px;padding:14px;border-left:5px solid}.scam{background:#fee2e2;border-color:#dc2626}.notscam{background:#dcfce7;border-color:#16a34a}.hint{font-size:.9rem;color:#64748b}</style></head>
<body><main class="box"><p class="hint"><a href="/dashboard">View model analysis &amp; graphs →</a></p><h1>ScamShield</h1><p class="sub">English &amp; Roman Urdu SMS / WhatsApp scam detector</p><label for="message"><b>Paste a message to assess</b></label><textarea id="message" rows="7" maxlength="1000" placeholder="For example: Congratulations! Claim your prize now..."></textarea><button id="check">Check message</button><div id="result" role="status"></div><p class="hint">Prototype only — do not rely on this result for financial or safety decisions.</p></main>
<script>const input=document.querySelector('#message'),button=document.querySelector('#check'),box=document.querySelector('#result');button.onclick=async()=>{box.style.display='block';box.className='';box.textContent='Checking…';try{const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:input.value})}),d=await r.json();if(d.error){box.textContent=d.error;return}box.className=d.label==='Scam'?'scam':'notscam';const scam=d.scam_signals.length?d.scam_signals.join(', '):'none';const legit=d.legit_signals.length?d.legit_signals.join(', '):'none';box.innerHTML=`<b>Result: ${d.label}</b> — scam probability: ${d.probability}%<br><small>Matched scam-style signals: ${scam}<br>Matched legitimate-style signals: ${legit}</small><br><a href="/dashboard?message=${encodeURIComponent(input.value)}">View full decision explanation on dashboard →</a>`}catch{box.textContent='Could not contact the server. Is main.py running?'}};</script></body></html>
